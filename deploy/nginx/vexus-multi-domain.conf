# =============================================================================
#  Vexus 交易所 —— 多域名 / 子域分离方案（可选，进阶）
# =============================================================================
#  什么时候需要本方案？
#    · 想把后台 /data(WS) /api 拆到独立子域，便于单独做 CDN、WAF、限流、证书与访问控制；
#    · 想给后台单独绑定一个不公开的域名（配合 IP 白名单更安全）。
#
#  ⚠️ 重要前提：前端编译产物里
#      · 接口全部是**相对路径** `/api/xxx!action`（PC/WAP 都是），没有配置成绝对域名；
#      · WebSocket 地址硬编码为 `wss://<补丁域名>/data/websocket`。
#    所以：
#      1) 如果只是把 api 拆到 api.your-domain.com，主站仍必须保留 /api/ 反代（否则前端 404），
#         子域 api 仅用于对外集成 / 调试；
#      2) 如果要把 WS 拆到 data.your-domain.com，必须重新跑补丁脚本把 WS 改成该子域：
#         patch-frontend.ps1 -Domain data.your-domain.com 会同时把 https 链接改成该域，不理想；
#         更简单的做法是生成后手工 sed 两个文件：
#           sed -i 's#wss://your-domain.com/data/websocket#wss://data.your-domain.com/data/websocket#' \
#               deploy/frontend/zcx/js/app.71218f6a.js \
#               deploy/frontend/zcx/wap/js/app.b1f9f5578f88f56a.js
#         并让 data 子域的 location /data/ 反代到 Tomcat /data/；
#      3) 后台拆到 admin.your-domain.com 最省事：前端没有任何指向后台的硬编码（admin_url 只影响后台自己生成的链接）。
#
#  证书：
#    · 每个子域单独 certbot --nginx -d api.your-domain.com；
#    · 或申请通配符 *.your-domain.com（必须 DNS-01 验证）：
#        certbot certonly --manual --preferred-challenges dns -d '*.your-domain.com' -d your-domain.com
#      宝塔：SSL → Let's Encrypt → 勾选“通配符”即可。
#
#  ⚠️ 本文件只列“多域名方案与单域名方案的差异部分”，为节省篇幅省略了：
#     gzip、静态资源长缓存、已补丁入口 js 短缓存、隐藏文件拒绝、/symbol/ 与 /wap/ 的完整 location 细节。
#     实际使用时请以 vexus-single-domain.conf 为主干，把主站的 80/443 server 块整体替换为下面的多域版本，
#     其余静态/缓存/gzip 段落原样保留。
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
#  1) 主站（前端静态 + 主站 API + 主站 WS，保持单域名方案里同样的反代）
#     your-domain.com / www.your-domain.com
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com www.your-domain.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/vexus/site;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/nginx/snippets/vexus-ssl.conf;   # 即 vexus-https-ssl.conf 的内容

    root  /www/wwwroot/vexus/site;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    access_log /www/wwwroot/vexus/logs/access.log;
    error_log  /www/wwwroot/vexus/logs/error.log warn;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 主站必须保留这几个反代（前端靠它们工作），proxy_pass 末尾带 / 用于替换前缀：
    #   /api/item!list.action        -> /web/api/item!list.action
    #   /wap/api/xxx!action          -> /web/api/xxx!action
    #   /wap/public/uploadimg!action -> /web/public/uploadimg!action
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080/web/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location ^~ /wap/api/ {
        proxy_pass http://127.0.0.1:8080/web/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location ^~ /wap/public/ {
        proxy_pass http://127.0.0.1:8080/web/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location ^~ /public/ {
        proxy_pass http://127.0.0.1:8080/web/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    location ^~ /data/ {
        proxy_pass http://127.0.0.1:8080/data/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /images/ { alias /www/wwwroot/vexus/images/; expires 30d; access_log off; }
    location ^~ /symbol/ { try_files $uri =404; expires 30d; access_log off; }

    location = /index.html     { expires -1; }
    location = /wap/index.html { expires -1; }
    location = /wap            { return 301 /wap/; }
    location ^~ /wap/          { try_files $uri $uri/ /wap/index.html; }
    location /                 { try_files $uri $uri/ /index.html; }

    # 本方案假设后台已拆到 admin.your-domain.com，因此这里**不再**暴露 /admin
    # 如需临时保留：location ^~ /admin/ { proxy_pass http://127.0.0.1:8080/admin/; ... }
}

# -----------------------------------------------------------------------------
#  2) 后台子域：admin.your-domain.com → Tomcat /admin
#     推荐开启 IP 白名单 / 宝塔防火墙 / 只走内网；不要暴露给公网搜索引擎。
# -----------------------------------------------------------------------------
server {
    listen      80;
    server_name admin.your-domain.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/vexus/site; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl http2;
    server_name admin.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/admin.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.your-domain.com/privkey.pem;
    include /etc/nginx/snippets/vexus-ssl.conf;

    access_log /www/wwwroot/vexus/logs/admin.access.log;
    error_log  /www/wwwroot/vexus/logs/admin.error.log warn;
    client_max_body_size 20m;

    # 【强建议】后台仅允许固定 IP：
    # allow 203.0.113.10;
    # deny  all;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / { return 301 /admin/; }

    location /admin/ {
        proxy_pass http://127.0.0.1:8080/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# -----------------------------------------------------------------------------
#  3) 对外 API 子域：api.your-domain.com → Tomcat /web/api
#     主站前端不会用它（前端接口是相对路径），仅供外部接入 / 独立限流。
# -----------------------------------------------------------------------------
server {
    listen      80;
    server_name api.your-domain.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/vexus/site; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl http2;
    server_name api.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/api.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.your-domain.com/privkey.pem;
    include /etc/nginx/snippets/vexus-ssl.conf;

    access_log /www/wwwroot/vexus/logs/api.access.log;
    error_log  /www/wwwroot/vexus/logs/api.error.log warn;
    client_max_body_size 20m;

    # 若允许浏览器跨域直连本子域，再加 CORS；否则建议只给服务端调用并加限流
    # add_header Access-Control-Allow-Origin  "https://your-domain.com" always;
    # add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;
    # add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
    # if ($request_method = OPTIONS) { return 204; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/web/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

# -----------------------------------------------------------------------------
#  4) 行情/WS 子域：data.your-domain.com → Tomcat /data（含 /data/websocket）
#     注意：前端 WS 地址硬编码在主域名，用本子域需按文件头部说明重打补丁或手工 sed。
# -----------------------------------------------------------------------------
server {
    listen      80;
    server_name data.your-domain.com;
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/vexus/site; default_type "text/plain"; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl http2;
    server_name data.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/data.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.your-domain.com/privkey.pem;
    include /etc/nginx/snippets/vexus-ssl.conf;

    access_log /www/wwwroot/vexus/logs/data.access.log;
    error_log  /www/wwwroot/vexus/logs/data.error.log warn;

    location ^~ /data/ {
        proxy_pass http://127.0.0.1:8080/data/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# =============================================================================
#  多域方案额外注意
# =============================================================================
#  1) 前端补丁里的域名必须与主站一致（httpx 链接/WS）；拆出 WS 子域后记得手工改 2 个 js。
#  2) 后台 system.properties 的 admin_url / web_url / http.server.host 要改成对外真实访问地址：
#       admin_url=https://admin.your-domain.com/admin
#       web_url=https://your-domain.com/wap
#       http.server.host=https://your-domain.com/images/
#  3) 跨域：主站前端全部相对路径，不需要 CORS；只有“浏览器直连 api 子域”才需要 CORS。
#  4) 证书：子域各自申请，或通配符 *.your-domain.com（DNS-01）；HSTS includeSubDomains 前确保所有子域都有 HTTPS。
