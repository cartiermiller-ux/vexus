# =============================================================================
#  Vexus 交易所 —— HTTPS / SSL 参数片段（vexus-single-domain.conf 的配套文件）
# =============================================================================
#  用法（二选一）：
#    A. 直接复制：把下面「SSL 参数」整段粘到 vexus-single-domain.conf 的
#       443 server 块里（替换掉简版 4 行 ssl_protocols/ssl_ciphers/... 即可）。
#    B. 片段 include：把本文件放到 /etc/nginx/snippets/vexus-ssl.conf，
#       然后在 443 server 块里 `include /etc/nginx/snippets/vexus-ssl.conf;`。
#
#  证书申请（三选一）：
#    1) certbot（Let's Encrypt，推荐 Ubuntu/Debian）：
#         apt install -y certbot python3-certbot-nginx
#         certbot --nginx -d your-domain.com -d www.your-domain.com --redirect
#       Webroot 模式（不自动改 nginx 配置时）：
#         certbot certonly --webroot -w /www/wwwroot/vexus/site -d your-domain.com -d www.your-domain.com
#       续期：certbot renew --dry-run   （certbot 会装 systemd timer 自动续期）
#    2) 宝塔面板：网站 → SSL → Let's Encrypt 一键申请（自动续期），
#       证书路径为 /www/server/panel/vhost/cert/your-domain.com/{fullchain,privkey}.pem
#    3) acme.sh：acme.sh --issue -d your-domain.com -w /www/wwwroot/vexus/site
#       证书路径为 ~/.acme.sh/your-domain.com_ecc/{fullchain,key}.pem（需自行配置续期 reload）
#
#  注意：
#    · 先把 DNS A/AAAA 解析到本机，80 端口放行，否则 HTTP-01 验证失败；
#    · 证书路径与 server_name 必须对应；通配符 *.your-domain.com 需要 DNS-01 验证
#      （multidomain 方案见 vexus-multi-domain.conf）；
#    · 首次上线建议先注释 HSTS（或降低 max-age），确认 HTTPS 稳定后再开启。
# =============================================================================

# ---------- 必填：证书与私钥路径（改 your-domain.com） ----------
# certbot 默认路径：
ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
# 宝塔面板默认路径（二选一，注释掉上面两行再启用）：
# ssl_certificate     /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
# ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;

# ---------- TLS 协议与加密套件（Mozilla intermediate 的 nginx 配置，2024 起通用） ----------
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# ---------- 会话复用（降低握手开销，交易所高并发场景建议开） ----------
ssl_session_timeout  1d;
ssl_session_cache    shared:SSL:10m;
ssl_session_tickets  off;

# ---------- OCSP Stapling（Let's Encrypt 证书可用；acme.sh 签发的也支持） ----------
ssl_stapling         on;
ssl_stapling_verify  on;
resolver             223.5.5.5 1.1.1.1 valid=300s;
resolver_timeout     5s;

# ---------- HSTS（首次上线可先注释，确认全站 HTTPS 后再开） ----------
# includeSubDomains 会要求所有子域都支持 HTTPS；若还有 http 子域请先去掉该参数。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------- 可选：DH 参数（仅用 DHE 套件时需要） ----------
# openssl dhparam -out /etc/nginx/dhparam.pem 2048
# ssl_dhparam /etc/nginx/dhparam.pem;

# ---------- 可选：如果 CDN 回源只允许 TLSv1.3，可用下面更严格的写法 ----------
# ssl_protocols TLSv1.3;
# ssl_ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

# =============================================================================
#  证书到期与部署检查常用命令
# =============================================================================
# 查看证书到期时间：
#   openssl x509 -in /etc/letsencrypt/live/your-domain.com/fullchain.pem -noout -dates
# 证书链是否正确（浏览器无警告即可）：
#   openssl s_client -connect your-domain.com:443 -servername your-domain.com < /dev/null 2>/dev/null | openssl x509 -noout -issuer -subject -dates
# 续期后重载 nginx（certbot 自动加的 hook 一般已包含）：
#   nginx -t && systemctl reload nginx
# 宝塔用户：面板 → 网站 → SSL → 续期；或 crontab 里 /www/server/panel/pyenv/bin/python /www/server/panel/plugin/ssl/ssl_update.py
