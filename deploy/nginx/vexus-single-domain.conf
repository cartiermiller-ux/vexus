# =============================================================================
#  Vexus 交易所 —— 单域名 Nginx 主配置（HTTP 跳 HTTPS + 前端静态 + 后端反代）
# =============================================================================
#  使用前必须替换的占位符（都在本文件中，搜索替换即可）：
#    your-domain.com            → 你的域名（server_name / 证书路径 / 日志可保持）
#    /www/wwwroot/vexus/site     → 前端静态目录（deploy/frontend/zcx 的内容）
#    /www/wwwroot/vexus/images   → 后台上传目录（= system.properties 的 images.dir）
#    /www/wwwroot/vexus/logs     → 日志目录（需要 mkdir -p 并 chown）
#    证书路径                    → 见 vexus-https-ssl.conf 里的 certbot / 宝塔两种写法
#
#  放置方式：
#    · 源码编译 nginx：本文件放 /etc/nginx/conf.d/vexus.conf（nginx.conf 的 http{} 内会 include conf.d/*.conf）
#    · 宝塔面板：网站 → 设置 → 配置文件，用本文件里的 80/443 两个 server 块整体替换默认内容
#
#  后端 Tomcat 部署约定（三个应用在同一个 Tomcat，默认 127.0.0.1:8080）：
#    · admin 应用 context = /admin   ｜ 源码版 system.properties: admin_url=http://127.0.0.1:8080/admin
#    · api   应用 context = /web     ｜ 控制器 @RequestMapping 写死 /api/xxx!yyy.action
#    · data  应用 context = /data    ｜ WebSocket: /data/websocket/{type}/{param}（type 1=实时 2=成交 3=深度）
#    为什么 api 用 /web 而不是 ROOT：旧版 RMI 要求 api webapp 的 context path 非空；
#    所以外网 /api/ 必须反代成 Tomcat 的 /web/api/，否则 404（详见 docs/04-前端与Nginx.md）。
#    web3 预编译版的配置是 /schw（admin_url=http://<旧域名>/schw），本文件默认按源码版 /admin 写，
#    /schw 作为注释备选放在 /admin 段后面，不要同时启用两组。
# =============================================================================

# WebSocket 升级头映射（必须在 http{} 上下文；conf.d/*.conf 与宝塔站点配置都在 http{} 内，可直接使用）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
#  80：ACME 验证 + 全部 301 跳 HTTPS
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name your-domain.com www.your-domain.com;

    # certbot webroot / 宝塔 HTTP 验证都走这里（把验证文件放到 site/.well-known/acme-challenge/）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/vexus/site;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
#  443：主站
# -----------------------------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    # nginx >= 1.25.1 推荐写成：listen 443 ssl; http2 on;（老版本保留上面的 http2 参数即可）

    server_name your-domain.com www.your-domain.com;

    # ---------- 证书 ----------
    # certbot（Let's Encrypt）默认路径：
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # 宝塔面板默认路径（用宝塔申请证书时改成这两行，并注释掉上面两行）：
    # ssl_certificate     /www/server/panel/vhost/cert/your-domain.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/your-domain.com/privkey.pem;

    # 完整 SSL 参数（协议/套件/会话缓存/HSTS/OCSP）见 vexus-https-ssl.conf：
    #   方式 A：把该文件内容整段粘到下面（推荐，少一个 include 依赖）
    #   方式 B：把该文件放到 /etc/nginx/snippets/vexus-ssl.conf，然后启用下面这行
    # include /etc/nginx/snippets/vexus-ssl.conf;
    #
    # —— 下面 4 行是最小可用简版，使用了方式 B 时请删掉或注释 ——
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---------- 站点根目录 / 基础参数 ----------
    root  /www/wwwroot/vexus/site;
    index index.html;
    charset utf-8;

    access_log /www/wwwroot/vexus/logs/access.log;
    error_log  /www/wwwroot/vexus/logs/error.log warn;

    # 上传/身份认证图片：KYC 可能传较大图片，按需调整
    client_max_body_size 20m;
    client_body_timeout  60s;

    # ---------- 安全响应头（server 级；各 location 未 add_header 时自动继承） ----------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 注意：前端有内联脚本（页面加载动画/配置），暂不建议上严格 CSP；如需可后续加 report-only 观察。

    # ---------- gzip ----------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/javascript application/json application/xml
                      image/svg+xml application/wasm font/woff2;

    # =========================================================================
    #  一、后端反代（注意：^~ 前缀的优先级高于普通前缀，且会跳过正则 location）
    # =========================================================================
    # 说明：proxy_pass 末尾带 / 表示“把 location 前缀替换成目标前缀”：
    #   /api/item!list.action  →  /web/api/item!list.action（正好匹配 api 控制器）
    #   /wap/api/realtime!execute.action → /web/api/realtime!execute.action
    #   /public/uploadimg!execute.action → /web/public/uploadimg!execute.action

    # 1) 对外 API：前端所有 /api/xxx!yyy.action
    # disable public test-account registration endpoint
    location = /api/localuser!registerTest.action {
        return 403;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080/web/api/;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
        expires -1;   # 接口不缓存（expires -1 生成 Cache-Control: no-cache；不用 add_header 以免覆盖安全头）
    }

    # 2) 后台 JSP 特殊调用：<base> + "wap/api/realtime!execute.action"
    #    必须先于 /wap/ 静态匹配；同时 zcx\wap\api 假数据目录已在补丁脚本里整体排除。
    location ^~ /wap/api/ {
        proxy_pass http://127.0.0.1:8080/web/api/;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        expires -1;
    }

    # 3) 上传/图片接口：UploadImgController、ShowImgController 的 basePath=/public/...
    #    前端上传地址形如 https://host/wap/public/uploadimg!execute.action
    location ^~ /wap/public/ {
        proxy_pass http://127.0.0.1:8080/web/public/;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }

    # 4) 根路径上传接口（部分页面直接 POST /public/uploadimg!execute.action）
    location ^~ /public/ {
        proxy_pass http://127.0.0.1:8080/web/public/;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering       off;
    }

    # 5) WebSocket + 行情数据：wss://your-domain.com/data/websocket/{type}/{param}
    #    type: 1=实时行情 2=最新成交 3=深度；前端 PC/WAP 的 WS 地址已在补丁时改成新域名。
    location ^~ /data/ {
        proxy_pass http://127.0.0.1:8080/data/;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;   # map 见文件顶部
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;   # WS 长连接：不能太短，否则 60s 后被 nginx 掐断
        proxy_read_timeout    3600s;
        proxy_buffering       off;     # 实时推送必须关闭缓冲
        proxy_cache_bypass    $http_upgrade;
        proxy_socket_keepalive on;     # nginx >= 1.15.6
    }

    # 6) 后台管理：源码版 /admin（admin_url=http://127.0.0.1:8080/admin）
    location = /admin { return 301 /admin/; }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8080/admin/;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        client_max_body_size 20m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 【安全建议】后台只允许办公 IP 访问：取消下面两行注释并改成你的固定 IP
        # allow 203.0.113.10;
        # deny  all;
    }

    # ---- 备选（仅在部署 web3 预编译版、admin_url=/schw 时启用，二选一）----
    # location = /schw { return 301 /schw/; }
    # location ^~ /schw/ {
    #     proxy_pass http://127.0.0.1:8080/schw/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Connection "";
    #     client_max_body_size 20m;
    #     proxy_read_timeout 120s;
    # }

    # =========================================================================
    #  二、静态资源
    # =========================================================================
    # 7) 后台上传目录（http.server.host=https://your-domain.com/images/ + images.dir=/www/wwwroot/vexus/images/）
    #    /images/ 映射到站点根之外的目录，用 alias；
    #    若想对不存在的文件直接 404，可改成：root /www/wwwroot/vexus;  （去掉 alias）
    location ^~ /images/ {
        alias /www/wwwroot/vexus/images/;
        autoindex off;
        expires 30d;
        access_log off;
    }

    # 8) 币种图标（前端根目录 /symbol/，实际文件在 site/symbol/；WAP 图标在 /wap/symbol/ 由 /wap/ 处理）
    location ^~ /symbol/ {
        try_files $uri =404;
        autoindex off;
        expires 30d;
        access_log off;
    }

    # 9) WAP 站（zcx\wap\，webpack publicPath=/wap/）
    location = /wap { return 301 /wap/; }

    location ^~ /wap/ {
        try_files $uri $uri/ /wap/index.html;

        # WAP 是 hash 路由（/wap/#/login），静态文件直接命中；fallback 只是 history 模式兼容兜底。
        location ~* \.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|otf|map)$ {
            try_files $uri =404;
            expires 30d;
            access_log off;
        }
    }

    # 10) 入口 HTML 不缓存（补丁后强刷立即生效；入口 JS 见下方“已补丁文件短缓存”）
    location = /index.html {
        expires -1;
    }
    location = /wap/index.html {
        expires -1;
    }

    # 11) 已补丁过的入口 JS/CSS 文件名未变（webpack hash 没更新），部署后先短缓存 1 小时，
    #     配合浏览器强刷/CDN 刷新；确认线上生效后可删除本段恢复下面的 30d 长缓存。
    location ~* ^/(?:js/(?:app|chunk-vendors)\.[^/]+\.js|css/(?:app|chunk-vendors)\.[^/]+\.css|wap/js/(?:app|chunk-vendors)\.[^/]+\.js|wap/css/(?:app|chunk-vendors)\.[^/]+\.css)$ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    # 12) 其它带 hash 的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|webp|svg|ico|woff2?|ttf|eot|otf|map)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 13) 隐藏文件（.git/.env 等）拒绝访问，ACME 验证目录除外
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # 14) PC 站 SPA fallback
    #     PC 编译产物里 vue-router 未传 mode，默认 hash 模式（地址形如 /#/index），
    #     因此正常访问只需 / 与静态资源；这里保留 fallback：
    #       - 对 hash 模式无副作用；
    #       - 以后若改成 history 模式（/order/exchangeHistory 这类无 # 地址），本行就是必需的。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 15) 404 页面（zcx 自带 404.html）
    error_page 404 /404.html;

    # ---- 可选：Tomcat upstream + keepalive（高并发时建议启用，把上面 4 处 proxy_pass 全改成 http://vexus_tomcat/...） ----
    # upstream vexus_tomcat {
    #     server 127.0.0.1:8080;
    #     keepalive 32;
    # }
}
