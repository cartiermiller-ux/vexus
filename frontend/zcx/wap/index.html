    <script id="vexus-hide-empty-message">
(function () {
  if (window.__vexusMsgFix) return;
  window.__vexusMsgFix = true;
  function clean() {
    try {
      var list = document.querySelectorAll('.el-message, .el-notification');
      for (var i = 0; i < list.length; i++) {
        var el = list[i];
        var text = (el.innerText || '').replace(/\s+/g, '');
        if (!text) { el.style.display = 'none'; }
      }
    } catch (e) {}
  }
  setInterval(clean, 250);
  window.addEventListener('load', clean);
  document.addEventListener('DOMContentLoaded', clean);
})();
</script>
