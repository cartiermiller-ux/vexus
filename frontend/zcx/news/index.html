<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vexus 市场资讯</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#2b2350 0%,#0d0a1a 55%,#08060f 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.vx-header{height:64px;display:flex;align-items:center;gap:30px;padding:0 40px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(9,7,18,.72);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}
.vx-logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px;font-size:18px}
.vx-logo img{width:28px}
.vx-nav{display:flex;gap:24px;font-size:14px;color:rgba(255,255,255,.72)}
.vx-nav a:hover,.vx-nav .active{color:#fff}
.vx-nav .active{color:#bda7ff;font-weight:700}
.vx-user{margin-left:auto;font-size:13px;color:rgba(255,255,255,.6)}
.vx-wrap{max-width:1280px;margin:0 auto;padding:32px 24px 60px}
.vx-title h1{font-size:30px;margin:0 0 8px}
.vx-title p{margin:0;color:rgba(255,255,255,.55);font-size:13px}
.vx-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px}
.vx-panel{border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;background:rgba(14,11,28,.7);backdrop-filter:blur(12px)}
.vx-panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.vx-panel-head strong{font-size:15px}
.vx-panel-head span{font-size:12px;color:rgba(255,255,255,.4)}
.vx-foot{margin-top:18px;font-size:12px;color:rgba(255,255,255,.35);line-height:1.7}
@media(max-width:850px){.vx-header{padding:0 16px;gap:14px}.vx-nav{display:none}.vx-wrap{padding:22px 14px 40px}.vx-title h1{font-size:23px}.vx-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="vx-header">
  <a class="vx-logo" href="/"><img src="/img/logos.4d851092.svg" alt="">VEXUS</a>
  <nav class="vx-nav">
    <a href="/">首页</a>
    <a href="/#/market">行情</a>
    <a href="/stocks/">股票</a>
    <a href="/tradfi/">TradFi</a>
    <a class="active" href="/news/">资讯</a>
    <a href="/#/promote">福利中心</a>
  </nav>
  <div class="vx-user">市场资讯 · TradingView</div>
</header>
<main class="vx-wrap">
  <div class="vx-title">
    <h1>市场资讯</h1>
    <p>全球市场新闻、加密货币快讯与财经头条，由 TradingView 官方组件提供</p>
  </div>
  <div class="vx-grid">
    <div class="vx-panel">
      <div class="vx-panel-head"><strong>实时资讯</strong><span>Timeline</span></div>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
        {
          "feedMode": "all_symbols",
          "isTransparent": true,
          "displayMode": "regular",
          "width": "100%",
          "height": "700",
          "colorTheme": "dark",
          "locale": "zh_CN"
        }
        </script>
      </div>
    </div>
    <div class="vx-panel">
      <div class="vx-panel-head"><strong>热门头条</strong><span>Top Stories</span></div>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
        {
          "feedMode": "all_symbols",
          "isTransparent": true,
          "displayMode": "compact",
          "width": "100%",
          "height": "700",
          "colorTheme": "dark",
          "locale": "zh_CN"
        }
        </script>
      </div>
    </div>
  </div>
  <div class="vx-foot">
    资讯内容由 TradingView 提供，Vexus 不对第三方资讯的准确性作担保；不构成投资建议。
  </div>
</main>
<script src="/js/i18next.min.js"></script>
<script src="/js/vexus-i18n.js?v=20261230"></script>
<script src="/js/vexus-page-i18n.js?v=20261236"></script>
</body>
</html>
