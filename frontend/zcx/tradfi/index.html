<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vexus TradFi · 全球市场</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#2b2350 0%,#0d0a1a 55%,#08060f 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.vx-header{height:64px;display:flex;align-items:center;gap:34px;padding:0 40px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(9,7,18,.72);backdrop-filter:blur(18px);position:sticky;top:0;z-index:20}
.vx-logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:1px;font-size:18px}
.vx-logo img{width:28px}
.vx-nav{display:flex;gap:24px;font-size:14px;color:rgba(255,255,255,.72)}
.vx-nav a:hover{color:#fff}
.vx-nav .active{color:#bda7ff;font-weight:700}
.vx-user{margin-left:auto;font-size:13px;color:rgba(255,255,255,.65)}
.vx-wrap{max-width:1280px;margin:0 auto;padding:32px 24px 60px}
.vx-title{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.vx-title h1{font-size:30px;margin:0 0 8px}
.vx-title p{margin:0;color:rgba(255,255,255,.55);font-size:13px}
.vx-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.vx-tab{height:36px;padding:0 15px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:rgba(255,255,255,.72);cursor:pointer;font-size:13px}
.vx-tab:hover{background:rgba(124,92,255,.22);color:#fff}
.vx-tab.active{border-color:rgba(167,139,250,.6);background:rgba(124,92,255,.28);color:#fff}
.vx-panel{border:1px solid rgba(255,255,255,.09);border-radius:16px;overflow:hidden;background:rgba(14,11,28,.7);backdrop-filter:blur(12px);margin-bottom:20px}
.vx-panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.vx-panel-head strong{font-size:15px}
.vx-panel-head span{font-size:12px;color:rgba(255,255,255,.4)}
#tvchart{height:520px}
.vx-widget{width:100%}
.vx-foot{margin-top:18px;font-size:12px;color:rgba(255,255,255,.35);line-height:1.7}
@media(max-width:700px){.vx-header{padding:0 16px;gap:16px}.vx-nav{display:none}.vx-wrap{padding:22px 14px 40px}.vx-title h1{font-size:23px}#tvchart{height:380px}}
</style>
</head>
<body>

  <div class="vx-panel">

      {

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
(function(){
  var current = {symbol:'OANDA:XAUUSD', name:'黄金 XAU/USD'};
  function createChart(){
    document.getElementById('tvchart').innerHTML = '';
    document.getElementById('chartName').textContent = current.name;
    new TradingView.widget({
      container_id: 'tvchart',
      autosize: true,
      symbol: current.symbol,
      interval: 'D',
      timezone: 'Asia/Shanghai',
      theme: 'dark',
      style: '1',
      locale: 'zh_CN',
      toolbar_bg: '#0e0b1c',
      enable_publishing: false,
      allow_symbol_change: true,
      hide_side_toolbar: false,
      studies: ['Volume@tv-basicstudies']
    });
  }
  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('.vx-tab');
    if(!b) return;
    Array.prototype.forEach.call(document.querySelectorAll('.vx-tab'), function(x){x.classList.remove('active');});
    b.classList.add('active');
    current = {symbol:b.getAttribute('data-symbol'), name:b.getAttribute('data-name')};
    createChart();
  });
  createChart();
})();
</script>
</body>
</html>
