<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外汇模拟交易 - Vexus</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0b0914;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
a{color:inherit;text-decoration:none}
.fx-header{height:60px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid rgba(255,255,255,.08);background:#100d1c;gap:26px;position:sticky;top:0;z-index:20}
.fx-logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.5px}
.fx-logo img{width:30px;height:30px}
.fx-nav{display:flex;gap:22px;font-size:14px;color:rgba(255,255,255,.68)}
.fx-nav a:hover{color:#fff}
.fx-nav .active{color:#b9a7ff;font-weight:700}
.fx-user{margin-left:auto;font-size:12px;color:rgba(255,255,255,.5)}
.fx-wrap{max-width:1320px;margin:0 auto;padding:34px 22px 70px}
.fx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.fx-head h1{font-size:28px;margin:0 0 8px}
.fx-head p{margin:0;color:rgba(255,255,255,.55);font-size:13px;line-height:1.7}
.fx-badge{font-size:12px;color:#d0c4ff;border:1px solid rgba(167,139,250,.35);background:rgba(124,92,255,.12);padding:7px 12px;border-radius:8px;white-space:nowrap}
.fx-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:stretch}
.fx-card{background:linear-gradient(180deg,#15122a,#0f0d1d);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.chart-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.chart-head strong{font-size:17px}
.chart-head span{font-size:11px;color:rgba(255,255,255,.45)}
#fx-chart{height:560px;background:#0f0d1d}
.order-card{padding:18px}
.order-card .account{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;border-radius:12px;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.25);margin-bottom:16px}
.order-card .account span{font-size:12px;color:rgba(255,255,255,.62)}
.order-card .account b{font-size:18px;color:#fff}
label{display:block;font-size:12px;color:rgba(255,255,255,.55);margin:12px 0 6px}
select,input{width:100%;height:40px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:#1a1730;color:#fff;padding:0 10px;outline:none;font-size:13px}
.price-quote{display:flex;gap:10px;margin-top:14px}
.price-quote div{flex:1;border-radius:10px;background:#121022;border:1px solid rgba(255,255,255,.08);padding:10px 12px}
.price-quote span{display:block;font-size:11px;color:rgba(255,255,255,.45);margin-bottom:4px}
.price-quote b{font-size:16px;font-variant-numeric:tabular-nums}
.price-quote .down b{color:#F6465D}.price-quote .up b{color:#0ECB81}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;height:44px;border:0;border-radius:11px;font-weight:800;font-size:15px;cursor:pointer}
.buy{background:#0ECB81;color:#04140d}.sell{background:#F6465D;color:#fff}
.tip{font-size:11px;line-height:1.7;color:rgba(255,255,255,.38);margin-top:13px}
.positions{margin-top:18px}
.positions .card-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.positions .card-head b{font-size:16px}.positions .card-head span{font-size:12px;color:rgba(255,255,255,.45)}
.pos-empty{padding:34px;text-align:center;color:rgba(255,255,255,.38);font-size:13px}
.pos-row{display:grid;grid-template-columns:1fr .6fr .55fr .7fr .7fr .7fr .8fr 64px;gap:8px;align-items:center;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.055);font-size:12px}
.pos-row.head{color:rgba(255,255,255,.4);font-size:11px}
.order-estimate{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(124,92,255,.10);border:1px solid rgba(124,92,255,.22)}
.order-estimate .line{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0;color:rgba(255,255,255,.55)}
.order-estimate .line b{color:#fff;font-size:13px;font-weight:600}
.order-estimate .line.warn b{color:#F6465D}
.tpsl-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tpsl-item{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:9px}
.tpsl-title{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.65);margin-bottom:7px}
.fx-switch{position:relative;display:inline-block;width:34px;height:18px;margin:0}
.fx-switch input{display:none}
.fx-slider{position:absolute;inset:0;border-radius:18px;background:rgba(255,255,255,.16);transition:.2s;cursor:pointer}
.fx-slider:before{content:"";position:absolute;width:14px;height:14px;left:2px;top:2px;border-radius:50%;background:#fff;transition:.2s}
.fx-switch input:checked + .fx-slider{background:#7c5cff}
.fx-switch input:checked + .fx-slider:before{transform:translateX(16px)}
.tpsl-stepper{display:flex;align-items:center;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.05)}
.tpsl-stepper button{border:0;background:rgba(255,255,255,.08);color:#fff;width:26px;height:28px;cursor:pointer}
.tpsl-stepper button:hover{background:rgba(124,92,255,.4)}
.tpsl-stepper input{flex:1;width:100%;border:0;background:transparent;color:#fff;text-align:center;font-size:12px;height:28px;outline:none}
.tpsl-stepper input:disabled{color:rgba(255,255,255,.3)}
.tpsl-stepper input::-webkit-outer-spin-button,.tpsl-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pos-row button{height:30px;border:0;border-radius:7px;background:rgba(124,92,255,.25);color:#d7ccff;cursor:pointer;font-size:12px}
.fx-foot{text-align:center;color:rgba(255,255,255,.3);font-size:11px;margin-top:24px}
@media(max-width:900px){.fx-grid{grid-template-columns:1fr}#fx-chart{height:380px}.fx-nav{display:none}.fx-head{display:block}.fx-badge{display:inline-block;margin-top:12px}}
</style>
</head>
<body>
<header class="fx-header">
  <a class="fx-logo" href="/"><img src="/img/logos.4d851092.svg" alt="">VEXUS</a>
  <nav class="fx-nav">
    <a href="/">首页</a><a href="/#/market">行情</a><a href="/#/trade/btc">交易</a>
    <a class="active" href="/tradfi/">TradFi</a><a href="/tradfi/forex/">外汇模拟</a>
  </nav>
  <div class="fx-user" data-i18n="forex.demoTag">模拟资金 · 不涉及真实资金</div>
</header>
<main class="fx-wrap">
  <div class="fx-head">
    <div><h1 data-i18n="forex.title">外汇模拟交易</h1><p data-i18n="forex.subtitle">使用虚拟资金练习外汇交易，行情来自公开汇率接口；不涉及真实资金，不构成投资建议。</p></div>
    <div class="fx-badge" id="cfgBadge" data-i18n="forex.badge">模拟交易所</div>
  </div>

  <div class="fx-grid">
    <section class="fx-card">
      <div class="chart-head"><strong id="pairTitle">EUR/USD</strong><span id="quoteUpdated">--</span></div>
      <div id="fx-chart"></div>
    </section>
    <aside class="fx-card order-card">
      <div class="account"><span data-i18n="forex.available">虚拟可用资金</span><b id="balance">100,000.00 USD</b></div>
      <label data-i18n="forex.pair">交易品种</label><select id="pairSelect"></select>
      <div class="price-quote">
        <div class="down"><span data-i18n="forex.sell">卖出价</span><b id="sellPrice">--</b></div>
        <div class="up"><span data-i18n="forex.buy">买入价</span><b id="buyPrice">--</b></div>
      </div>
      <label data-i18n="forex.leverage">杠杆</label><select id="levSelect"></select>
      <label data-i18n="forex.qty">数量（标准手）</label><input id="qtyInput" type="number" value="1" min="0.01" step="0.01">
      <div class="tpsl-fields">
        <div class="tpsl-item">
          <div class="tpsl-title"><span>止损价格</span><label class="fx-switch"><input type="checkbox" id="slToggle"><span class="fx-slider"></span></label></div>
          <div class="tpsl-stepper"><button type="button" data-step="sl|-">−</button><input id="slInput" type="number" step="0.00001" value="0" disabled><button type="button" data-step="sl|+">＋</button></div>
        </div>
        <div class="tpsl-item">
          <div class="tpsl-title"><span>止盈价格</span><label class="fx-switch"><input type="checkbox" id="tpToggle"><span class="fx-slider"></span></label></div>
          <div class="tpsl-stepper"><button type="button" data-step="tp|-">−</button><input id="tpInput" type="number" step="0.00001" value="0" disabled><button type="button" data-step="tp|+">＋</button></div>
        </div>
      </div>
      <div class="order-estimate">
        <div class="line"><span>数量</span><b id="qtyPreview">1 手</b></div>
        <div class="line"><span>预估手续费</span><b id="feePreview">0.00 USD</b></div>
        <div class="line"><span>预估保证金</span><b id="marginPreview">0.00 USD</b></div>
        <div class="line"><span>可用资金</span><b id="availPreview">0.00 USD</b></div>
      </div>
      <div class="actions"><button class="buy" id="buyBtn" data-i18n="forex.buyBtn">买入</button><button class="sell" id="sellBtn" data-i18n="forex.sellBtn">卖出</button></div>
      <div class="tip" data-i18n="forex.tip">1 标准手 = 100,000 基础货币。点差、初始资金、杠杆、品种由后台配置控制。</div>
    </aside>
  </div>

  <section class="fx-card positions">
    <div class="card-head"><b data-i18n="forex.positions">持仓</b><span id="posCount">0 项</span></div>
    <div id="positions"></div>
  </section>
  <div class="fx-foot" data-i18n="forex.foot">模拟交易仅用于学习演示，所有价格来自公开汇率数据；虚拟资金不具备任何现实价值。</div>
</main>

<script src="/js/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  var DEFAULT = {
    enabled: true, initial_balance: 100000, default_leverage: 100,
    leverage_options: [1, 10, 20, 50, 100], spread_pips: 1.2, commission: 0,
    pairs: {
      EURUSD:{name:'EUR/USD',tv:'FX:EURUSD',base:'EUR',quote:'USD',pip:0.0001,decimals:5},
      GBPUSD:{name:'GBP/USD',tv:'FX:GBPUSD',base:'GBP',quote:'USD',pip:0.0001,decimals:5},
      USDJPY:{name:'USD/JPY',tv:'FX:USDJPY',base:'USD',quote:'JPY',pip:0.01,decimals:3},
      AUDUSD:{name:'AUD/USD',tv:'FX:AUDUSD',base:'AUD',quote:'USD',pip:0.0001,decimals:5},
      USDCAD:{name:'USD/CAD',tv:'FX:USDCAD',base:'USD',quote:'CAD',pip:0.0001,decimals:5},
      USDCHF:{name:'USD/CHF',tv:'FX:USDCHF',base:'USD',quote:'CHF',pip:0.0001,decimals:5},
      NZDUSD:{name:'NZD/USD',tv:'FX:NZDUSD',base:'NZD',quote:'USD',pip:0.0001,decimals:5},
      EURJPY:{name:'EUR/JPY',tv:'FX:EURJPY',base:'EUR',quote:'JPY',pip:0.01,decimals:3}
    }
  };
  var cfg = JSON.parse(JSON.stringify(DEFAULT));
  var state = null;
  var authToken = localStorage.getItem('spToken') || '';
  var rates = {};
  var current = 'EURUSD';
  var chart = null;
  var candleSeries = null;
  var priceLines = [];

  function $(id){ return document.getElementById(id); }
  function money(n){ return Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' USD'; }
  function loadState(){
    try { state = JSON.parse(localStorage.getItem('vexus_forex_paper_v1')); } catch(e) { state = null; }
    if (!state || !state.positions) state = { balance: Number(cfg.initial_balance) || 100000, positions: [] };
    if (!state.balance && state.balance !== 0) state.balance = Number(cfg.initial_balance) || 100000;
    saveState();
  }
  function saveState(){ localStorage.setItem('vexus_forex_paper_v1', JSON.stringify(state)); }
  function pairMeta(){ return cfg.pairs[current] || DEFAULT.pairs[current] || DEFAULT.pairs.EURUSD; }
  function rawRate(code){
    var p = pairMeta();
    var r = rates || {};
    if (!r[p.base] || !r[p.quote]) return null;
    return (p.quote === 'USD' ? (1 / r[p.base]) : (r[p.quote] / r[p.base]));
  }
  function displayPrice(){
    var p = pairMeta(), r = rawRate();
    if (r) return Number(r.toFixed(p.decimals || 5));
    var fallbacks = {EURUSD:1.0989,GBPUSD:1.2740,USDJPY:155.20,AUDUSD:0.6550,USDCAD:1.3700,USDCHF:0.8850,NZDUSD:0.5950,EURJPY:170.5};
    return fallbacks[current] || 1;
  }
  function quote(){
    var p = pairMeta(), r = displayPrice();
    var spread = (Number(cfg.spread_pips) || 0) * (Number(p.pip) || 0.0001);
    return { bid: Number((r - spread/2).toFixed(p.decimals||5)), ask: Number((r + spread/2).toFixed(p.decimals||5)), mid: r };
  }
  function renderPrice(){
    var p = pairMeta(), q = quote();
    updateEstimate();
    $('pairTitle').textContent = p.name;
    $('sellPrice').textContent = q.bid.toFixed(p.decimals||5);
    $('buyPrice').textContent = q.ask.toFixed(p.decimals||5);
    $('quoteUpdated').textContent = ((window.VexusI18n && window.VexusI18n.t('forex.updated')) || '更新 ') + ' ' + new Date().toLocaleTimeString('zh-CN',{hour12:false});
  }
  function fallbackCandles(mid, count){
    var rnd = 0;
    for (var k = 0; k < current.length; k++) rnd = (rnd * 31 + current.charCodeAt(k)) % 1000003;
    var data = [];
    var price = Number(mid) || 1;
    var now = Math.floor(Date.now() / 1000);
    for (var i = count - 1; i >= 0; i--) {
      rnd = (rnd * 9301 + 49297) % 233280;
      var wave = (rnd / 233280 - 0.5) * 0.0016;
      var open = price * (1 - wave * 0.5);
      var close = price * (1 + wave * 0.5);
      var high = Math.max(open, close) * (1 + Math.abs(wave) * 0.35);
      var low = Math.min(open, close) * (1 - Math.abs(wave) * 0.35);
      data.push({ time: now - i * 300, open: open, high: high, low: low, close: close });
      price = close;
    }
    return data;
  }

  function loadChart(){
    var p = pairMeta();
    var box = $('fx-chart');
    box.innerHTML = '';
    if (!window.LightweightCharts) {
      box.innerHTML = '<div style="padding:30px;color:rgba(255,255,255,.4);font-size:13px">图表 SDK 加载中…</div>';
      return;
    }
    chart = LightweightCharts.createChart(box, {
      width: box.clientWidth || 800,
      height: box.clientHeight || 560,
      layout: { background: { color: '#0f0d1d' }, textColor: '#9d97b8' },
      grid: { vertLines: { color: 'rgba(255,255,255,.045)' }, horzLines: { color: 'rgba(255,255,255,.045)' } },
      rightPriceScale: { borderColor: 'rgba(255,255,255,.08)' },
      timeScale: { borderColor: 'rgba(255,255,255,.08)', timeVisible: true, secondsVisible: false },
      crosshair: { mode: 0 }
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: '#0ECB81', downColor: '#F6465D', borderVisible: false,
      wickUpColor: '#0ECB81', wickDownColor: '#F6465D'
    });
    var candles = fallbackCandles(displayPrice(), 120);
    candleSeries.setData(candles);
    chart.timeScale().fitContent();
    setTimeout(function(){
      if (chart) chart.applyOptions({ width: box.clientWidth || 800, height: box.clientHeight || 560 });
      drawPriceLines();
    }, 60);
  }
  function drawPriceLines(){
    if (!candleSeries) return;
    priceLines.forEach(function(line){ try { candleSeries.removePriceLine(line); } catch(e) {} });
    priceLines = [];
    (state.positions || []).forEach(function(pos){
      if (pos.pair !== current) return;
      var p = cfg.pairs[pos.pair] || DEFAULT.pairs[pos.pair];
      if (pos.tp) priceLines.push(candleSeries.createPriceLine({price:Number(pos.tp), color:'#0ECB81', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'止盈'}));
      if (pos.sl) priceLines.push(candleSeries.createPriceLine({price:Number(pos.sl), color:'#F6465D', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'止损'}));
    });
  }
  function updateEstimate(){
    var qtyEl = $('qtyInput'), levEl = $('levSelect'), marginEl = $('marginPreview'), availEl = $('availPreview');
    if (!qtyEl || !levEl || !marginEl || !availEl) return;
    var qty = Number(qtyEl.value) || 0;
    var lev = Number(levEl.value) || 1;
    var p = pairMeta(), q = quote();
    var margin = qty * 100000 * q.mid / lev;
    if (p.quote !== 'USD' && rates.USD && rates.USD[p.quote]) margin = margin / rates.USD[p.quote];
    var fee = qty * (Number(cfg.commission) || 0);
    var avail = Number(state && state.balance ? state.balance : 0);
    var qtyElOut = $('qtyPreview'), feeEl = $('feePreview');
    if (qtyElOut) qtyElOut.textContent = qty + ' 手';
    if (feeEl) feeEl.textContent = money(fee);
    marginEl.textContent = money(margin);
    availEl.textContent = money(avail);
    var line = marginEl.parentNode;
    if (line) line.className = 'line' + (margin + fee > avail ? ' warn' : '');
  }

  function renderPairs(){
    var sel = $('pairSelect'); sel.innerHTML='';
    Object.keys(cfg.pairs || DEFAULT.pairs).forEach(function(k){
      var o=document.createElement('option'); o.value=k; o.textContent=cfg.pairs[k].name || k; sel.appendChild(o);
    });
    sel.value=current;
    sel.onchange=function(){ current=sel.value; renderPrice(); loadChart(); };
  }
  function renderLeverage(){
    var sel=$('levSelect'); sel.innerHTML='';
    (cfg.leverage_options || DEFAULT.leverage_options).forEach(function(v){
      var o=document.createElement('option'); o.value=v; o.textContent=v+'x'; sel.appendChild(o);
    });
    sel.value=cfg.default_leverage || (cfg.leverage_options||[1])[0];
    sel.onchange = updateEstimate;
  }
  function renderState(){
    $('balance').textContent = money(state.balance);
    var list = state.positions || [];
    $('posCount').textContent = list.length + ' ' + ((window.VexusI18n && window.VexusI18n.t('forex.items')) || '项');
    var html = '<div class="pos-row head"><span>品种</span><span>方向</span><span>数量</span><span>开仓价</span><span>止盈价</span><span>止损价</span><span>浮动盈亏</span><span>操作</span></div>';
    if (!list.length) { html = '<div class="pos-empty">暂无持仓</div>'; }
    else {
      list.forEach(function(pos,i){
        var p = cfg.pairs[pos.pair] || DEFAULT.pairs[pos.pair];
        var q = quoteFor(pos.pair);
        var diff = pos.side === 'buy' ? (q.mid - pos.open) : (pos.open - q.mid);
        var usd = diff * pos.qty * 100000;
        if (p.quote !== 'USD') { var usdrate = rates.USD && rates.USD[p.quote] ? rates.USD[p.quote] : 1; usd = usd / usdrate; }
        var tp = pos.tp ? Number(pos.tp).toFixed(p.decimals||5) : '--';
        var sl = pos.sl ? Number(pos.sl).toFixed(p.decimals||5) : '--';
        html += '<div class="pos-row"><span>'+p.name+'</span><span style="color:'+(pos.side==='buy'?'#0ECB81':'#F6465D')+'">'+(pos.side==='buy'?'买入':'卖出')+'</span><span>'+pos.qty+' 手</span><span>'+pos.open.toFixed(p.decimals||5)+'</span><span style="color:#0ECB81">'+tp+'</span><span style="color:#F6465D">'+sl+'</span><span style="color:'+(usd>=0?'#0ECB81':'#F6465D')+'">'+(usd>=0?'+':'')+usd.toFixed(2)+' USD</span><button data-close="'+i+'">平仓</button></div>';
      });
    }
    $('positions').innerHTML = html;
    drawPriceLines();
    Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(b){
      b.onclick=function(){
        var i=Number(b.getAttribute('data-close')); var pos=state.positions[i]; if(!pos) return;
        var q=quoteFor(pos.pair); var diff=pos.side==='buy'?(q.mid-pos.open):(pos.open-q.mid);
        var usd=diff*pos.qty*100000; var p=cfg.pairs[pos.pair]||DEFAULT.pairs[pos.pair];
        if(p.quote!=='USD'){ var ur=rates.USD&&rates.USD[p.quote]?rates.USD[p.quote]:1; usd=usd/ur; }
        var serverId = pos.serverId;
        function finishClose(){
          state.balance += usd; state.positions.splice(i,1); saveState(); renderState();
        }
        if (authToken && serverId) {
          fetch('/api/forexPaperApi.jsp', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:'action=close&token=' + encodeURIComponent(authToken) + '&id=' + encodeURIComponent(serverId) + '&price=' + encodeURIComponent(q.mid)})
            .then(function(r){return r.json()}).then(function(){ finishClose(); }).catch(function(){ finishClose(); });
        } else {
          finishClose();
        }
      };
    });
  }
  function quoteFor(code){
    var p=cfg.pairs[code]||DEFAULT.pairs[code];
    var fallbacks={EURUSD:1.0989,GBPUSD:1.2740,USDJPY:155.20,AUDUSD:0.6550,USDCAD:1.3700,USDCHF:0.8850,NZDUSD:0.5950,EURJPY:170.5};
    var mid=fallbacks[code]||1;
    if(rates&&rates[p.base]&&rates[p.quote]){
      mid = p.quote==='USD' ? 1/rates[p.base] : rates[p.quote]/rates[p.base];
    }
    var spread=(Number(cfg.spread_pips)||0)*(Number(p.pip)||0.0001);
    return {bid:mid-spread/2,ask:mid+spread/2,mid:mid};
  }
  function place(side){
    updateEstimate();
    authToken = localStorage.getItem('spToken') || '';
    if (cfg.enabled === false) { alert('模拟交易暂时关闭'); return; }
    var p=pairMeta(), q=quote();
    var qty=Number($('qtyInput').value);
    if(!qty||qty<0.01){ alert('请输入有效数量'); return; }
    var lev=Number($('levSelect').value)||1;
    var price=side==='buy'?q.ask:q.bid;
    var pipVal = Number(p.pip) || 0.0001;
    if ($('tpToggle').checked && (!Number($('tpInput').value))) {
      $('tpInput').value = (side === 'buy' ? price + pipVal * 30 : price - pipVal * 30).toFixed(p.decimals || 5);
    }
    if ($('slToggle').checked && (!Number($('slInput').value))) {
      $('slInput').value = (side === 'buy' ? price - pipVal * 30 : price + pipVal * 30).toFixed(p.decimals || 5);
    }
    var tp=Number($('tpInput').value)||0, sl=Number($('slInput').value)||0;
    if (tp && side==='buy' && tp<=price) { alert('买入止盈价必须高于当前买入价'); return; }
    if (tp && side==='sell' && tp>=price) { alert('卖出止盈价必须低于当前卖出价'); return; }
    if (sl && side==='buy' && sl>=price) { alert('买入止损价必须低于当前买入价'); return; }
    if (sl && side==='sell' && sl<=price) { alert('卖出止损价必须高于当前卖出价'); return; }
    var margin=qty*100000*price/lev;
    if(margin>state.balance){ alert('虚拟可用资金不足'); return; }
    state.balance-=margin;
    var pos = {pair:current,side:side,qty:qty,open:price,margin:margin,tp:tp,sl:sl};
    state.positions.push(pos);
    saveState(); renderState();
    if (authToken) {
      var body = 'action=open&token=' + encodeURIComponent(authToken) + '&pair=' + encodeURIComponent(current) +
        '&side=' + encodeURIComponent(side) + '&qty=' + encodeURIComponent(qty) +
        '&leverage=' + encodeURIComponent(lev) + '&price=' + encodeURIComponent(price) + '&tp=' + encodeURIComponent(tp) + '&sl=' + encodeURIComponent(sl);
      fetch('/api/forexPaperApi.jsp', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:body})
        .then(function(r){return r.json()}).then(function(d){ if(d && d.code === '0') { pos.serverId = d.id; saveState(); } }).catch(function(){});
    }
  }
  function loadConfig(){
    fetch('/forex-paper-config.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(data){
      if(data && data.pairs){ cfg=data; }
      var enabled = cfg.enabled !== false;
      $('cfgBadge').textContent = enabled ? '模拟交易所' : '模拟交易暂停';
      $('buyBtn').disabled = !enabled;
      $('sellBtn').disabled = !enabled;
      $('buyBtn').style.opacity = enabled ? '1' : '.45';
      $('sellBtn').style.opacity = enabled ? '1' : '.45';
      if (!enabled) { $('cfgBadge').style.color = '#f6b73c'; }
    }).catch(function(){}).then(function(){
      function setupTpSlControls(){
    function sync(inputId, toggleId){
      var on = $(toggleId).checked;
      $(inputId).disabled = !on;
      if (!on) $(inputId).value = '0';
    }
    $('tpToggle').onchange = function(){ sync('tpInput','tpToggle'); };
    $('slToggle').onchange = function(){ sync('slInput','slToggle'); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-step]'), function(btn){
      btn.onclick = function(){
        var parts = btn.getAttribute('data-step').split('|');
        var input = $(parts[0] + 'Input');
        var toggle = $(parts[0] + 'Toggle');
        if (!toggle.checked) { toggle.checked = true; sync(parts[0] + 'Input', parts[0] + 'Toggle'); }
        var p = pairMeta(), q = quote();
        var step = (Number(p.pip) || 0.0001) * 5;
        var v = Number(input.value) || q.mid;
        input.value = (parts[1] === '+' ? v + step : v - step).toFixed(p.decimals || 5);
      };
    });
  }
  loadState(); renderPairs(); renderLeverage(); renderPrice(); loadChart(); renderState(); setupTpSlControls(); updateEstimate();
  document.getElementById('qtyInput').addEventListener('input', updateEstimate);
    });
  }
  function syncServerOrders(){
    authToken = localStorage.getItem('spToken') || '';
    if (!authToken) return;
    fetch('/api/forexPaperApi.jsp?action=list&token=' + encodeURIComponent(authToken), {cache:'no-store'})
      .then(function(r){return r.json()}).then(function(d){
        if (!d || d.code !== '0' || !d.data) return;
        var server = d.data.map(function(x){
          var p = cfg.pairs[x.pair] || DEFAULT.pairs[x.pair] || DEFAULT.pairs.EURUSD;
          var margin = Number(x.qty) * 100000 * Number(x.open) / Math.max(1, Number(x.leverage));
          return {pair:x.pair, side:x.side, qty:Number(x.qty), open:Number(x.open), margin:margin, serverId:x.id, tp:Number(x.tp)||0, sl:Number(x.sl)||0};
        });
        // merge: keep local positions not present on server, add server positions missing locally
        var local = state.positions.filter(function(p){ return !p.serverId; });
        var known = {};
        state.positions.forEach(function(p){ if(p.serverId) known[p.serverId] = p; });
        server.forEach(function(p){ if(!known[p.serverId]) local.push(p); });
        state.positions = local;
        saveState(); renderState();
      }).catch(function(){});
  }

  function loadRates(){
    fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'}).then(function(r){return r.json()}).then(function(data){
      if(data && data.result==='success' && data.rates){ rates = {USD:1}; Object.keys(data.rates).forEach(function(k){rates[k]=data.rates[k]}); renderPrice(); renderState(); }
    }).catch(function(){});
  }
  $('buyBtn').onclick=function(){place('buy')};
  $('sellBtn').onclick=function(){place('sell')};
  loadState(); renderPairs(); renderLeverage(); renderPrice(); loadChart(); renderState();
  loadConfig(); loadRates(); syncServerOrders(); setInterval(loadRates,30000); setInterval(syncServerOrders,20000);
  window.addEventListener('resize', function(){ if (chart && $('fx-chart')) chart.applyOptions({ width: $('fx-chart').clientWidth, height: $('fx-chart').clientHeight }); });
})();
</script>
